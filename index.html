<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>혼인신고 축하 포토프레임</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Playfair+Display:wght@500;600;700&display=swap');

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #f9e8ed;
    font-family: 'Gowun Dodum', sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* 전체 앱 */
.app {
    width: 100%;
    max-width: 520px;
    height: 100vh;
    max-height: 950px;
    background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.9), transparent 20%),
        radial-gradient(circle at 85% 80%, rgba(255,190,210,.4), transparent 25%),
        linear-gradient(145deg, #fff8fa, #f9dce5);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* 상단 */
.header {
    height: 92px;
    flex-shrink: 0;
    text-align: center;
    padding-top: 16px;
    position: relative;
    z-index: 10;
}

.small-title {
    font-size: 12px;
    letter-spacing: 4px;
    color: #b56a82;
    margin-bottom: 3px;
}

.main-title {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    color: #8f3d5a;
    letter-spacing: 1px;
}

/* 카메라 영역 */
.camera-area {
    flex: 1;
    position: relative;
    margin: 0 14px;
    border-radius: 28px;
    overflow: hidden;
    background: #222;
    box-shadow:
        0 15px 40px rgba(155,70,100,.25),
        inset 0 0 0 1px rgba(255,255,255,.5);
}

/* 카메라 */
#video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    background: #222;
}

/* 프레임 */
.frame {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

/* 바깥 테두리 */
.frame::before {
    content: "";
    position: absolute;
    inset: 13px;
    border: 2px solid rgba(255,255,255,.95);
    border-radius: 21px;
    box-shadow:
        0 0 0 5px rgba(255,158,187,.55),
        0 0 0 7px rgba(255,255,255,.55);
}

/* 위 장식 */
.top-decoration {
    position: absolute;
    top: 25px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    text-shadow: 0 2px 8px rgba(110,30,60,.4);
}

.top-decoration .heart {
    font-size: 30px;
    margin-bottom: 4px;
}

.top-decoration .script {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    letter-spacing: 3px;
    font-weight: 600;
}

/* 아래쪽 */
.bottom-decoration {
    position: absolute;
    bottom: 25px;
    left: 20px;
    right: 20px;
    text-align: center;
    color: white;
    text-shadow: 0 2px 8px rgba(80,20,40,.65);
}

.congrats {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 4px;
}

.message {
    font-size: 12px;
    letter-spacing: 2px;
}

/* 하트 장식 */
.floating-heart {
    position: absolute;
    color: rgba(255,255,255,.9);
    text-shadow: 0 2px 10px rgba(150,50,80,.45);
    font-size: 23px;
}

.h1 { top: 23%; left: 7%; transform: rotate(-15deg); }
.h2 { top: 33%; right: 7%; transform: rotate(15deg); font-size: 17px; }
.h3 { bottom: 29%; left: 8%; font-size: 15px; }
.h4 { bottom: 35%; right: 8%; font-size: 22px; }

/* 반짝이 */
.sparkle {
    position: absolute;
    color: white;
    text-shadow: 0 0 10px white;
    animation: sparkle 1.8s infinite ease-in-out;
}

.s1 { top: 18%; left: 20%; }
.s2 { top: 27%; right: 20%; animation-delay: .5s; }
.s3 { bottom: 25%; right: 18%; animation-delay: 1s; }

@keyframes sparkle {
    0%,100% { opacity: .3; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1.25); }
}

/* 버튼 영역 */
.controls {
    height: 105px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 12px;
}

/* 버튼 */
.btn {
    border: 0;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    transition: .15s;
}

.btn:active {
    transform: scale(.94);
}

.camera-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: white;
    border: 7px solid #f3a4ba;
    box-shadow: 0 5px 15px rgba(170,70,100,.25);
    font-size: 27px;
}

.sub-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    color: #9b4b65;
    font-size: 21px;
    box-shadow: 0 4px 12px rgba(170,70,100,.15);
}

/* 촬영 후 미리보기 */
#result {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(255,245,248,.98);
    z-index: 30;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

#photo {
    max-width: 100%;
    max-height: 75%;
    border-radius: 18px;
    box-shadow: 0 12px 35px rgba(120,40,70,.25);
}

.result-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.result-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    background: #c95f7d;
    color: white;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

.result-btn.white {
    background: white;
    color: #a64d68;
}

/* 안내 */
.notice {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    text-align: center;
    color: white;
    background: rgba(60,20,30,.55);
    padding: 18px;
    border-radius: 18px;
    display: none;
    z-index: 20;
}

/* 모바일 */
@media (max-width: 600px) {
    .app {
        max-height: none;
    }

    .header {
        height: 82px;
    }

    .main-title {
        font-size: 25px;
    }

    .camera-area {
        margin: 0 10px;
        border-radius: 24px;
    }

    .controls {
        height: 95px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 상단 -->
    <div class="header">
        <div class="small-title">OUR SPECIAL DAY</div>
        <div class="main-title">JUST MARRIED ♡</div>
    </div>

    <!-- 카메라 -->
    <div class="camera-area">

        <video id="video" autoplay playsinline muted></video>

        <!-- 프레임 -->
        <div class="frame">

            <div class="top-decoration">
                <div class="heart">♡</div>
                <div class="script">WE SAID YES</div>
            </div>

            <div class="floating-heart h1">♥</div>
            <div class="floating-heart h2">♡</div>
            <div class="floating-heart h3">♡</div>
            <div class="floating-heart h4">♥</div>

            <div class="sparkle s1">✦</div>
            <div class="sparkle s2">✧</div>
            <div class="sparkle s3">✦</div>

            <div class="bottom-decoration">
                <div class="congrats">
                    혼인신고 축하해요 💕
                </div>

                <div class="message">
                    우리의 새로운 시작을 축하합니다
                </div>
            </div>

        </div>

        <div class="notice" id="notice"></div>

    </div>

    <!-- 버튼 -->
    <div class="controls">

        <button class="btn sub-btn"
                onclick="switchCamera()"
                title="카메라 전환">
            🔄
        </button>

        <button class="btn camera-btn"
                onclick="takePhoto()"
                title="사진 촬영">
            📸
        </button>

        <button class="btn sub-btn"
                onclick="toggleFullscreen()"
                title="전체화면">
            ⛶
        </button>

    </div>

    <!-- 촬영 결과 -->
    <div id="result">

        <img id="photo">

        <div class="result-buttons">

            <button class="result-btn"
                    onclick="retake()">
                다시 찍기
            </button>

            <button class="result-btn"
                    onclick="downloadPhoto()">
                사진 저장
            </button>

        </div>

    </div>

</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>

let stream = null;
let facingMode = "environment";

/* =========================
   카메라 시작
========================= */

async function startCamera() {

    try {

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: facingMode
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },
            audio: false
        });

        const video = document.getElementById("video");

        video.srcObject = stream;

        hideNotice();

    } catch (error) {

        console.error(error);

        showNotice(
            "카메라를 사용할 수 없습니다.<br><br>" +
            "브라우저에서 카메라 권한을 허용해주세요."
        );
    }
}


/* =========================
   카메라 전환
========================= */

async function switchCamera() {

    facingMode =
        facingMode === "environment"
        ? "user"
        : "environment";

    await startCamera();
}


/* =========================
   사진 촬영
========================= */

function takePhoto() {

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    if (!video.videoWidth) {
        showNotice("카메라가 준비될 때까지 잠시 기다려주세요.");
        return;
    }

    const width = video.videoWidth;
    const height = video.videoHeight;

    canvas.width = width;
    canvas.height = height;

    /* 카메라 이미지 */
    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    /* 핑크 프레임 */
    drawFrame(ctx, width, height);

    const image = canvas.toDataURL(
        "image/png"
    );

    document.getElementById("photo").src = image;

    document.getElementById("result").style.display = "flex";
}


/* =========================
   촬영 이미지에 프레임 합성
========================= */

function drawFrame(ctx, width, height) {

    /* 반투명 핑크 테두리 */

    ctx.save();

    ctx.strokeStyle = "rgba(255,158,187,0.85)";
    ctx.lineWidth = Math.max(width, height) * 0.012;

    const margin = Math.max(width, height) * 0.025;

    ctx.strokeRect(
        margin,
        margin,
        width - margin * 2,
        height - margin * 2
    );

    ctx.restore();


    /* 상단 그라데이션 */

    const topGradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            height * 0.27
        );

    topGradient.addColorStop(
        0,
        "rgba(120,35,65,.50)"
    );

    topGradient.addColorStop(
        1,
        "rgba(120,35,65,0)"
    );

    ctx.fillStyle = topGradient;

    ctx.fillRect(
        0,
        0,
        width,
        height * 0.27
    );


    /* 하단 그라데이션 */

    const bottomGradient =
        ctx.createLinearGradient(
            0,
            height * .68,
            0,
            height
        );

    bottomGradient.addColorStop(
        0,
        "rgba(100,25,55,0)"
    );

    bottomGradient.addColorStop(
        1,
        "rgba(100,25,55,.72)"
    );

    ctx.fillStyle = bottomGradient;

    ctx.fillRect(
        0,
        height * .68,
        width,
        height * .32
    );


    /* 상단 텍스트 */

    ctx.textAlign = "center";

    ctx.fillStyle = "#ffffff";

    ctx.shadowColor =
        "rgba(70,20,40,.55)";

    ctx.shadowBlur = 10;

    ctx.font =
        `600 ${width * .035}px Georgia`;

    ctx.fillText(
        "♡",
        width / 2,
        height * .075
    );

    ctx.font =
        `600 ${width * .030}px Georgia`;

    ctx.letterSpacing = "3px";

    ctx.fillText(
        "WE SAID YES",
        width / 2,
        height * .115
    );


    /* 하단 문구 */

    ctx.font =
        `bold ${width * .043}px sans-serif`;

    ctx.fillText(
        "혼인신고 축하해요 💕",
        width / 2,
        height * .91
    );

    ctx.font =
        `${width * .023}px sans-serif`;

    ctx.fillText(
        "우리의 새로운 시작을 축하합니다",
        width / 2,
        height * .945
    );

    ctx.shadowBlur = 0;


    /* 하트 장식 */

    ctx.font =
        `${width * .045}px sans-serif`;

    ctx.fillText(
        "♥",
        width * .08,
        height * .25
    );

    ctx.fillText(
        "♡",
        width * .91,
        height * .33
    );

    ctx.font =
        `${width * .03}px sans-serif`;

    ctx.fillText(
        "✦",
        width * .18,
        height * .20
    );

    ctx.fillText(
        "✧",
        width * .82,
        height * .23
    );

    ctx.fillText(
        "✦",
        width * .84,
        height * .72
    );
}


/* =========================
   다시 촬영
========================= */

function retake() {

    document.getElementById("result")
        .style.display = "none";
}


/* =========================
   사진 저장
========================= */

function downloadPhoto() {

    const image =
        document.getElementById("photo").src;

    const link =
        document.createElement("a");

    link.href = image;

    link.download =
        "혼인신고_축하_포토프레임.png";

    link.click();
}


/* =========================
   전체화면
========================= */

function toggleFullscreen() {

    const app =
        document.querySelector(".app");

    if (!document.fullscreenElement) {

        if (app.requestFullscreen) {
            app.requestFullscreen();
        }

    } else {

        document.exitFullscreen();

    }
}


/* =========================
   안내창
========================= */

function showNotice(text) {

    const notice =
        document.getElementById("notice");

    notice.innerHTML = text;

    notice.style.display = "block";
}

function hideNotice() {

    document.getElementById("notice")
        .style.display = "none";
}


/* =========================
   실행
========================= */

window.addEventListener(
    "load",
    startCamera
);

</script>

</body>
</html>
