<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>혼인신고 기념 포토부스</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;
}

h1 {
    text-align: center;
    margin: 20px 0 10px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.camera-area {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: auto;
    aspect-ratio: 3 / 4;
    background: black;
    overflow: hidden;
    border-radius: 20px;
}

/* 카메라 */
#camera {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* 선택된 프레임 */
#frame {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

/* 버튼 */
.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 15px 0;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

#capture {
    background: #ffffff;
    color: #111;
}

#switchCamera {
    background: #444;
    color: white;
}

/* 프레임 선택 */
.frame-title {
    text-align: center;
    margin-top: 25px;
}

.frames {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    max-width: 700px;
    margin: 15px auto;
}

.frame-button {
    padding: 0;
    background: #222;
    border: 3px solid transparent;
    border-radius: 10px;
    overflow: hidden;
}

.frame-button.selected {
    border-color: #4d8dff;
}

.frame-button img {
    display: block;
    width: 100%;
    height: auto;
}

/* 촬영 결과 */
.result {
    display: none;
    max-width: 600px;
    margin: 30px auto;
}

.result img {
    width: 100%;
    border-radius: 15px;
}

.download {
    display: block;
    margin-top: 15px;
    padding: 15px;
    background: white;
    color: black;
    text-align: center;
    text-decoration: none;
    border-radius: 12px;
    font-weight: bold;
}
</style>
</head>


<body>

<h1>💍 혼인신고 기념 포토부스</h1>

<div class="container">

    <!-- 카메라 -->
    <div class="camera-area">

        <video
            id="camera"
            autoplay
            playsinline>
        </video>

        <img
            id="frame"
            src="혼인신고_포토프레임_01.png">

    </div>


    <!-- 카메라 버튼 -->
    <div class="buttons">

        <button
            id="switchCamera">
            🔄 전면 / 후면
        </button>

        <button
            id="capture">
            📸 촬영
        </button>

    </div>


    <!-- 프레임 선택 -->
    <h2 class="frame-title">
        프레임 선택
    </h2>

    <div
        class="frames"
        id="frames">
    </div>


    <!-- 결과 -->
    <div
        class="result"
        id="result">

        <img
            id="resultImage">

        <a
            id="download"
            class="download"
            download="혼인신고_기념사진.png">
            ⬇️ 사진 저장
        </a>

    </div>

</div>


<script>

/* =========================
   프레임 목록
========================= */

const frameFiles = [
    "혼인신고_포토프레임_01.png",
    "혼인신고_포토프레임_02.png",
    "혼인신고_포토프레임_03.png",
    "혼인신고_포토프레임_04.png",
    "혼인신고_포토프레임_05.png",
    "혼인신고_포토프레임_06.png",
    "혼인신고_포토프레임_07.png",
    "혼인신고_포토프레임_08.png",
    "혼인신고_포토프레임_09.png"
];


/* =========================
   기본 설정
========================= */

const video =
    document.getElementById("camera");

const frame =
    document.getElementById("frame");

const capture =
    document.getElementById("capture");

const switchCamera =
    document.getElementById("switchCamera");

const frames =
    document.getElementById("frames");

const result =
    document.getElementById("result");

const resultImage =
    document.getElementById("resultImage");

const download =
    document.getElementById("download");


let currentFrame = 0;

let cameraMode = "user";

let stream = null;


/* =========================
   프레임 선택 버튼 생성
========================= */

frameFiles.forEach(
    (file, index) => {

        const button =
            document.createElement("button");

        button.className =
            "frame-button";

        if (index === 0) {
            button.classList.add(
                "selected"
            );
        }

        const image =
            document.createElement("img");

        image.src = file;

        button.appendChild(image);

        button.onclick = () => {

            currentFrame = index;

            frame.src = file;

            document
                .querySelectorAll(
                    ".frame-button"
                )
                .forEach(
                    b =>
                    b.classList.remove(
                        "selected"
                    )
                );

            button.classList.add(
                "selected"
            );
        };

        frames.appendChild(button);
    }
);


/* =========================
   카메라 시작
========================= */

async function startCamera() {

    /* 기존 카메라 종료 */

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track =>
                track.stop()
            );
    }


    try {

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {

                        facingMode:
                            cameraMode,

                        width: {
                            ideal: 1080
                        },

                        height: {
                            ideal: 1440
                        }

                    },

                    audio: false
                });


        video.srcObject =
            stream;


        await video.play();

    } catch (error) {

        alert(
            "카메라를 사용할 수 없습니다.\n" +
            "브라우저에서 카메라 권한을 허용해주세요."
        );

        console.error(error);
    }
}


/* =========================
   전면 / 후면 전환
========================= */

switchCamera.onclick =
    async () => {

        if (cameraMode === "user") {

            cameraMode =
                "environment";

        } else {

            cameraMode =
                "user";
        }

        await startCamera();
    };


/* =========================
   촬영
========================= */

capture.onclick = () => {

    if (!video.videoWidth) {

        alert(
            "카메라가 아직 준비되지 않았습니다."
        );

        return;
    }


    const canvas =
        document.createElement("canvas");


    const width = 1080;
    const height = 1440;


    canvas.width = width;
    canvas.height = height;


    const ctx =
        canvas.getContext("2d");


    /*
       카메라 화면을
       1080 × 1440에 맞춰 채움
    */

    const videoRatio =
        video.videoWidth /
        video.videoHeight;

    const canvasRatio =
        width / height;


    let sx = 0;
    let sy = 0;

    let sw =
        video.videoWidth;

    let sh =
        video.videoHeight;


    if (
        videoRatio >
        canvasRatio
    ) {

        sw =
            video.videoHeight *
            canvasRatio;

        sx =
            (video.videoWidth - sw)
            / 2;

    } else {

        sh =
            video.videoWidth /
            canvasRatio;

        sy =
            (video.videoHeight - sh)
            / 2;
    }


    /*
       전면 카메라는
       거울처럼 좌우 반전
    */

    if (
        cameraMode === "user"
    ) {

        ctx.save();

        ctx.translate(
            width,
            0
        );

        ctx.scale(
            -1,
            1
        );

        ctx.drawImage(
            video,
            sx,
            sy,
            sw,
            sh,
            0,
            0,
            width,
            height
        );

        ctx.restore();

    } else {

        ctx.drawImage(
            video,
            sx,
            sy,
            sw,
            sh,
            0,
            0,
            width,
            height
        );
    }


    /*
       선택한 프레임을
       카메라 위에 합성
    */

    const overlay =
        new Image();


    overlay.onload =
        () => {

            ctx.drawImage(
                overlay,
                0,
                0,
                width,
                height
            );


            /*
               PNG로 변환
            */

            const image =
                canvas.toDataURL(
                    "image/png"
                );


            /*
               결과 표시
            */

            resultImage.src =
                image;


            download.href =
                image;


            result.style.display =
                "block";
        };


    overlay.src =
        frameFiles[
            currentFrame
        ];
};


/* =========================
   처음 카메라 실행
========================= */

startCamera();

</script>

</body>
</html>
