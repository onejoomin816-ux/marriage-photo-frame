<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>혼인신고 축하 포토 프레임 스튜디오</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-bg: #e9e5db;
            --panel-bg: #fdfbf7;
            --text-dark: #333333;
        }

        body {
            margin: 0;
            background-color: #111;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        body.app-active {
            background-color: var(--app-bg);
        }

        /* --- 인트로 화면 --- */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            text-align: center;
        }
        .intro-title { font-size: 2rem; font-weight: 700; margin-bottom: 15px; }
        .intro-subtitle { font-size: 1.1rem; color: #ccc; margin-bottom: 40px; line-height: 1.6; }
        .start-btn {
            background-color: #fff; color: #111; border: none;
            padding: 18px 40px; border-radius: 30px; font-size: 1.2rem;
            font-weight: 700; cursor: pointer; transition: transform 0.2s;
        }
        .start-btn:active { transform: scale(0.95); }

        /* --- 메인 에디터 화면 --- */
        #editor-screen {
            display: none;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            max-height: 850px;
            background: var(--panel-bg);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            opacity: 0;
            transition: opacity 0.5s ease;
            flex-direction: column;
            overflow: hidden;
        }
        
        @media (min-width: 768px) {
            #editor-screen { flex-direction: row; }
        }

        .app-header {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-dark);
            display: none;
        }
        @media (min-width: 768px) {
            .app-header { display: block; position: absolute; top: 0; left: 0; width: 100%; z-index: 10;}
        }

        /* --- 좌측: 프레임 선택 패널 --- */
        .sidebar {
            flex: 0 0 380px;
            background: #f8f6f0;
            border-right: 1px solid #e0ddd5;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            margin-top: 60px;
        }
        @media (max-width: 767px) {
            .sidebar {
                flex: 0 0 150px; border-right: none; border-bottom: 1px solid #e0ddd5;
                margin-top: 0; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 10px;
            }
        }
        .sidebar-title {
            font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; color: var(--text-dark);
        }
        @media (max-width: 767px) { .sidebar-title { display: none; } }
        
        .frame-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        @media (max-width: 767px) {
            .frame-grid { display: flex; gap: 10px; }
        }

        .frame-thumb {
            position: relative;
            aspect-ratio: 2/3;
            border-radius: 8px;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s;
            overflow: hidden;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (max-width: 767px) { .frame-thumb { min-width: 100px; } }
        .frame-thumb:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .frame-thumb.active { border-color: #333; box-shadow: 0 0 0 2px #333; }
        
        .frame-thumb img {
            width: 100%; height: 100%; object-fit: contain;
            display: block;
        }

        /* --- 우측: 캔버스 및 컨트롤 패널 --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: var(--panel-bg);
            padding: 20px;
        }

        #camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 2/3;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(1);
        }
        .mirror { transform: scaleX(-1) !important; }

        /* 디자인 프레임 이미지가 비디오 위에 올라감 */
        #frame-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
            object-fit: cover;
        }

        .controls {
            margin-top: 30px; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;
        }
        .btn {
            border: none; padding: 15px 25px; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .btn:active { transform: translateY(2px); }
        .btn-primary { background: #333; color: #fff; }
        .btn-primary:hover { background: #000; }
        .btn-secondary { background: #fff; color: #333; border: 1px solid #ddd; }
        .btn-secondary:hover { background: #f0f0f0; }
    </style>
</head>
<body>

    <!-- 1. 인트로 화면 -->
    <div id="intro-screen">
        <div class="intro-title">💍 혼인신고 축하 포토 스튜디오</div>
        <div class="intro-subtitle">10가지 프레임 중 하나를 선택해 특별한 사진을 남겨보세요.</div>
        <button class="start-btn" onclick="startApp()">스튜디오 입장하기</button>
    </div>

    <!-- 2. 에디터 화면 -->
    <div id="editor-screen">
        <div class="app-header">혼인신고 축하 포토 프레임 스튜디오</div>
        
        <!-- 좌측 프레임 썸네일 선택기 -->
        <div class="sidebar">
            <div class="sidebar-title">프레임 선택</div>
            <div class="frame-grid" id="frame-list">
                <!-- JS에서 동적으로 10개의 썸네일 이미지 생성 -->
            </div>
        </div>

        <!-- 우측 카메라 캔버스 -->
        <div class="workspace">
            <div id="camera-wrapper">
                <video id="video" autoplay playsinline></video>
                
                <!-- 실제 프레임 이미지 오버레이 -->
                <img id="frame-overlay" src="prame1.png" alt="포토 프레임">
            </div>

            <div class="controls">
                <button class="btn btn-primary" onclick="takePhoto()">📸 사진 저장하기</button>
                <button class="btn btn-secondary" onclick="toggleCamera()">🔄 방향 전환</button>
                <button class="btn btn-secondary" onclick="location.reload()">취소</button>
            </div>
        </div>
    </div>

    <script>
        // 준비된 10개의 프레임 파일명 적용 (올려주신 파일명과 동일하게 설정)
        const frames = [
            "prame1.png",
            "prame2.png",
            "prame3.png",
            "prame4.jpg",
            "prame5.png",
            "prame6.png",
            "prame7.png",
            "prame8.png",
            "prame9.png",
            "prame10.png"
        ];

        let currentFrameIndex = 0;
        let stream = null;
        let currentFacingMode = "user"; // 기본 셀카 모드

        const video = document.getElementById('video');
        const overlayImg = document.getElementById('frame-overlay');
        const frameList = document.getElementById('frame-list');

        // 1. 좌측 패널에 10개의 썸네일 불러오기
        function initThumbnails() {
            frames.forEach((src, index) => {
                const thumb = document.createElement('div');
                thumb.className = `frame-thumb ${index === 0 ? 'active' : ''}`;
                
                // 썸네일에 프레임 이미지 넣기
                const img = document.createElement('img');
                img.src = src;
                thumb.appendChild(img);
                
                thumb.onclick = () => selectFrame(index);
                frameList.appendChild(thumb);
            });
        }

        // 2. 프레임 썸네일 클릭 시 변경
        function selectFrame(index) {
            currentFrameIndex = index;
            
            // 오버레이 이미지 변경
            overlayImg.src = frames[index];

            // UI 활성화 상태 업데이트
            document.querySelectorAll('.frame-thumb').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        // 3. 앱 시작 함수
        function startApp() {
            document.getElementById('intro-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro-screen').style.display = 'none';
                document.getElementById('editor-screen').style.display = 'flex';
                document.body.classList.add('app-active');
                
                setTimeout(() => { document.getElementById('editor-screen').style.opacity = '1'; }, 50);
                
                initThumbnails();
                startCamera();
            }, 500);
        }

        // 4. 카메라 권한 및 스트림 제어
        async function startCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            
            video.classList.toggle('mirror', currentFacingMode === "user");

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode, width: { ideal: 1080 }, height: { ideal: 1440 } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("카메라를 실행할 수 없거나 권한이 거부되었습니다.");
            }
        }

        function toggleCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        }

        // 5. 사진 촬영 후 이미지 합성 및 다운로드
        function takePhoto() {
            const canvas = document.createElement('canvas');
            // 고해상도 저장을 위해 캔버스 사이즈 설정
            const cw = video.videoWidth || 1080;
            const ch = video.videoHeight || 1440;
            canvas.width = cw; 
            canvas.height = ch;
            const ctx = canvas.getContext('2d');

            // 1. 카메라 영상 그리기 (셀카모드 시 좌우 반전 적용)
            if (currentFacingMode === "user") {
                ctx.translate(cw, 0); 
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, cw, ch);
            if (currentFacingMode === "user") {
                ctx.translate(cw, 0); 
                ctx.scale(-1, 1); // 다음 그리기를 위해 원상 복구
            }

            // 2. 투명 프레임 이미지 그 영상 위에 덮어 씌우기
            const frameImage = new Image();
            frameImage.crossOrigin = "Anonymous"; // CORS 이슈 방지
            frameImage.src = frames[currentFrameIndex];
            
            frameImage.onload = () => {
                // 영상 위에 프레임 이미지 렌더링
                ctx.drawImage(frameImage, 0, 0, cw, ch);

                // 3. 최종 합성 이미지 다운로드
                const link = document.createElement('a');
                link.download = `wedding_frame_${currentFrameIndex + 1}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        }
    </script>
</body>
</html>
