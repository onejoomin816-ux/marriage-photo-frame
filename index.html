<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혼인신고 축하 포토 프레임</title>
    <!-- 우아한 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Gowun Batang', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3/4;
            background: #000;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 전면 카메라일 때 좌우 반전 효과를 위한 클래스 (JS에서 제어) */
            transform: scaleX(1);
        }
        .mirror {
            transform: scaleX(-1) !important;
        }
        /* 화려한 오버레이 프레임 디자인 */
        #frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-sizing: border-box;
            border: 15px solid transparent;
            border-image: linear-gradient(135deg, #ffb6c1, #ffd700, #ffc0cb, #f0e68c) 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 15px;
            z-index: 10;
        }
        /* 꽃 장식 위치 설정 */
        .floral-corner {
            position: absolute;
            font-size: 2rem;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.6));
            z-index: 15;
        }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }
        .top-center { top: 15px; left: 50%; transform: translateX(-50%); }
        .bottom-center { bottom: 65px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; }

        .header-text {
            text-align: center;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
            margin-top: 35px;
        }
        .header-text h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #FFDF00;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header-text p {
            margin: 8px 0 0;
            font-size: 1.1rem;
            color: #FFF0F5;
        }
        .footer-text {
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            font-size: 1.3rem;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 10px;
        }
        #controls {
            margin-top: 20px;
            z-index: 20;
            display: flex;
            gap: 15px;
        }
        button {
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        button:active {
            transform: scale(0.95);
        }
        .switch-btn {
            background: #ffffff;
            color: #333;
        }
        .capture-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: #333;
        }
    </style> <!-- 이 부분이 이전 코드에서 잘못되어 있었습니다! -->
</head>
<body>

    <div id="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        
        <!-- 화면에 보여지는 프레임 및 꽃 장식 -->
        <div id="frame-overlay">
            <div class="floral-corner top-left">🌸🌿</div>
            <div class="floral-corner top-center">🌷</div>
            <div class="floral-corner top-right">🌿🌺</div>
            
            <div class="header-text">
                <h1>혼인신고를 축하합니다</h1>
                <p>오늘부터 우리는 하나 💍</p>
            </div>
            
            <div class="floral-corner bottom-center">🌼💐🌼</div>
            <div class="footer-text">
                부천시 원미구
            </div>

            <div class="floral-corner bottom-left">🌺🍃</div>
            <div class="floral-corner bottom-right">🍃🌸</div>
        </div>
    </div>

    <div id="controls">
        <button class="switch-btn" onclick="toggleCamera()">🔄 방향 전환</button>
        <button class="capture-btn" onclick="takePhoto()">📸 사진 저장</button>
    </div>

    <script>
        const video = document.getElementById('video');
        let currentFacingMode = "environment"; // 기본값: 후면 카메라
        let stream = null;

        // 카메라 시작 함수
        async function startCamera() {
            // 기존 카메라 실행 중이면 중지
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            // 전면 카메라인 경우 좌우 반전 클래스 추가
            if (currentFacingMode === "user") {
                video.classList.add('mirror');
            } else {
                video.classList.remove('mirror');
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1080 },
                        height: { ideal: 1440 }
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("카메라를 실행할 수 없습니다. 권한 설정을 확인해주세요.");
                console.error(err);
            }
        }

        // 전면/후면 전환 함수
        function toggleCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        }

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // 1. 카메라 영상 그리기 (전면 카메라이면 좌우 반전해서 캡처)
            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 반전 상태 원래대로 복구 (텍스트와 테두리는 똑바로 나와야 함)
            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            // 2. 화려한 테두리 그리기
            const padding = 30;
            ctx.lineWidth = 30;
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#ffb6c1');
            gradient.addColorStop(0.5, '#ffd700');
            gradient.addColorStop(1, '#ffc0cb');
            ctx.strokeStyle = gradient;
            ctx.strokeRect(padding, padding, canvas.width - (padding*2), canvas.height - (padding*2));

            // 3. 그림자 효과 설정
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // 4. 꽃 장식 그리기 (이모지)
            ctx.font = '70px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('🌸🌿', padding + 15, padding + 70); // 좌상단
            ctx.textAlign = 'right';
            ctx.fillText('🌿🌺', canvas.width - padding - 15, padding + 70); // 우상단
            ctx.textAlign = 'center';
            ctx.fillText('🌷', canvas.width / 2, padding + 60); // 상단 중앙
            
            ctx.textAlign = 'left';
            ctx.fillText('🌺🍃', padding + 15, canvas.height - padding - 20); // 좌하단
            ctx.textAlign = 'right';
            ctx.fillText('🍃🌸', canvas.width - padding - 15, canvas.height - padding - 20); // 우하단
            
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('🌼💐🌼', canvas.width / 2, canvas.height - padding - 120); // 하단 중앙 꽃

            // 5. 텍스트 설정 및 그리기
            ctx.textAlign = 'center';
            
            // 상단 메인 타이틀
            ctx.font = 'bold 75px "Gowun Batang", serif';
            ctx.fillStyle = '#FFDF00';
            ctx.fillText('혼인신고를 축하합니다', canvas.width / 2, padding + 160);

            // 상단 서브 타이틀
            ctx.font = '40px "Gowun Batang", serif';
            ctx.fillStyle = '#FFF0F5';
            ctx.fillText('오늘부터 우리는 하나 💍', canvas.width / 2, padding + 230);

            // 하단 기관명
            ctx.font = 'bold 50px "Gowun Batang", serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('부천시 원미구', canvas.width / 2, canvas.height - padding - 50);

            // 6. 이미지 다운로드 처리
            const link = document.createElement('a');
            link.download = 'congratulations_photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 페이지 로드 시 카메라 자동 시작
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
