<!-- 시작 화면 -->
<div id="startScreen" class="screen start-screen">

    <div class="start-deco">♡</div>

    <div class="start-content">

        <div class="ring">💍</div>

        <div class="eyebrow">
            OUR SPECIAL DAY
        </div>

        <h1>
            혼인신고<br>
            <span>축하 포토프레임</span>
        </h1>

        <p>
            소중한 혼인신고의 순간을<br>
            예쁜 사진으로 남겨보세요 ♡
        </p>

        <button class="start-button"
                onclick="enterCamera()">
            사진 촬영 시작
            <span>→</span>
        </button>

    </div>

    <div class="start-footer">

        <div class="city-mark">

            <div class="city-symbol">
                <span>BU</span>
            </div>

            <div class="city-name">
                <strong>부천시</strong>
                <span>원미구</span>
            </div>

        </div>

    </div>

</div>


<!-- 촬영 화면 -->
<div id="cameraScreen"
     class="screen camera-screen"
     style="display:none;">

    <div class="header">

        <div class="small-title">
            OUR SPECIAL DAY
        </div>

        <div class="main-title">
            JUST MARRIED ♡
        </div>

    </div>

    <div class="camera-area">

        <video id="video"
               autoplay
               playsinline
               muted></video>

        <div class="frame">

            <div class="top-decoration">

                <div class="heart">♡</div>

                <div class="script">
                    WE SAID YES
                </div>

            </div>

            <div class="floating-heart h1">♥</div>
            <div class="floating-heart h2">♡</div>
            <div class="floating-heart h3">♡</div>
            <div class="floating-heart h4">♥</div>

            <div class="sparkle s1">✦</div>
            <div class="sparkle s2">✧</div>
            <div class="sparkle s3">✦</div>

            <div class="bottom-decoration">

                <div class="congrats">
                    혼인신고 축하해요 💕
                </div>

                <div class="message">
                    우리의 새로운 시작을 축하합니다
                </div>

                <!-- 하단 기관 표시 -->
                <div class="photo-city">
                    <span class="mini-mark">BU</span>
                    <span>부천시 원미구</span>
                </div>

            </div>

        </div>

        <div class="notice"
             id="notice">
        </div>

    </div>


    <div class="controls">

        <button class="btn sub-btn"
                onclick="switchCamera()">
            🔄
        </button>

        <button class="btn camera-btn"
                onclick="takePhoto()">
            📸
        </button>

        <button class="btn sub-btn"
                onclick="goHome()">
            🏠
        </button>

    </div>

</div>


<!-- 촬영 결과 -->
<div id="result">

    <img id="photo">

    <div class="result-buttons">

        <button class="result-btn white"
                onclick="retake()">
            다시 찍기
        </button>

        <button class="result-btn"
                onclick="downloadPhoto()">
            사진 저장
        </button>

    </div>

</div>
