<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혼인신고 축하 포토 프레임</title>
    <!-- 우아한 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nanum+Gothic:wght@400;700&family=Namsan&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #111111; /* 인트로 화면을 위한 어두운 배경 */
            color: #3a1c0d;
            font-family: 'Namsan', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            transition: background-color 0.5s ease;
        }
        
        /* 카메라 화면 켜졌을 때의 바디 배경 (고급스러운 크림색) */
        body.app-active {
            background-color: #fdf6e3; 
            background-image: radial-gradient(#ffffff 20%, transparent 20%);
            background-size: 15px 15px;
        }

        /* --- 인트로 화면 스타일 --- */
        #intro-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            text-align: center;
        }
        .intro-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .intro-subtitle {
            font-size: 1rem;
            color: #aaaaaa;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .start-btn {
            background-color: #ffffff;
            color: #111111;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }
        .start-btn:active {
            transform: scale(0.95);
        }
        .intro-info {
            font-size: 0.85rem;
            color: #666666;
            line-height: 1.5;
        }

        /* --- 카메라 앱 화면 스타일 --- */
        #app-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3/4;
            background: #000;
            box-shadow: 0 10px 30px rgba(224, 176, 255, 0.3);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(1);
        }
        .mirror {
            transform: scaleX(-1) !important;
        }
        
        /* 프레임 오버레이 디자인 */
        #frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-sizing: border-box;
            border: 15px solid transparent;
            border-image: linear-gradient(135deg, #e0b0ff, #f0e68c, #ffd700, #ffb6c1) 1;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 20px;
            z-index: 10;
        }
        .floral-art {
            position: absolute;
            font-size: 2rem;
            color: rgba(224, 176, 255, 0.8);
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.4));
            z-index: 15;
            font-family: Arial, sans-serif;
        }
        .top-left { top: 15px; left: 15px; }
        .top-right { top: 15px; right: 15px; }
        .bottom-left { bottom: 15px; left: 15px; }
        .bottom-right { bottom: 15px; right: 15px; }
        .top-center { top: 10px; left: 50%; transform: translateX(-50%); }
        .bottom-center { bottom: 75px; left: 50%; transform: translateX(-50%); font-size: 1.5rem; }

        .header-text {
            text-align: center;
            text-shadow: 2px 2px 5px rgba(253, 246, 227, 0.8);
            margin-top: 35px;
        }
        .header-text h1 {
            margin: 0;
            font-size: 2rem;
            color: #d4af37;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header-text p {
            margin: 10px 0 0;
            font-size: 1.2rem;
            color: #e0b0ff;
            font-weight: 400;
        }
        .footer-text {
            text-align: center;
            text-shadow: 2px 2px 4px rgba(253, 246, 227, 0.8);
            font-size: 1.4rem;
            color: #fdf6e3;
            font-weight: 700;
            margin-bottom: 10px;
        }
        #controls {
            margin-top: 25px;
            z-index: 20;
            display: flex;
            gap: 20px;
        }
        .btn-app {
            border: none;
            padding: 18px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-family: 'Namsan', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-app:active {
            transform: scale(0.95);
        }
        .switch-btn {
            background: linear-gradient(135deg, #e0b0ff, #fdf6e3);
            color: #4a0e4e;
        }
        .capture-btn {
            background: linear-gradient(135deg, #ffc0cb 0%, #ffb6c1 100%);
            color: #4a0e4e;
        }
    </style>
</head>
<body>

    <!-- 1. 첫 접속 시 보여지는 인트로 화면 -->
    <div id="intro-screen">
        <div class="intro-title">
            💍 혼인신고를 축하드립니다
        </div>
        <div class="intro-subtitle">
            두 분의 특별한 오늘을<br>축하 프레임과 함께 사진으로 남겨보세요.
        </div>
        <button class="start-btn" onclick="startApp()">카메라 시작하기</button>
        <div class="intro-info">
            카메라 사용 권한을 허용해 주세요.<br>사진은 촬영 후 휴대폰에 저장할 수 있습니다.
        </div>
    </div>

    <!-- 2. 시작하기 버튼 누르면 보여지는 실제 카메라 화면 -->
    <div id="app-screen">
        <div id="camera-wrapper">
            <video id="video" autoplay playsinline></video>
            
            <div id="frame-overlay">
                <div class="floral-art top-left">🌸🌿<span style="font-size:1.5rem">♥</span></div>
                <div class="floral-art top-center">🌷</div>
                <div class="floral-art top-right">♥<span style="font-size:1.5rem">🌿🌺</span></div>
                
                <div class="header-text">
                    <h1>혼인신고를 축하합니다</h1>
                    <p>오늘부터 우리는 하나 💍</p>
                </div>
                
                <div class="floral-art bottom-center">♥🌼💐🌼♥</div>
                <div class="footer-text">
                    부천시 원미구
                </div>

                <div class="floral-art bottom-left">🌺🍃<span style="font-size:1.5rem">♥</span></div>
                <div class="floral-art bottom-right">♥<span style="font-size:1.5rem">🍃🌸</span></div>
            </div>
        </div>

        <div id="controls">
            <button class="btn-app switch-btn" onclick="toggleCamera()">🔄 방향 전환</button>
            <button class="btn-app capture-btn" onclick="takePhoto()">📸 하트 사진 저장</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const introScreen = document.getElementById('intro-screen');
        const appScreen = document.getElementById('app-screen');
        
        let currentFacingMode = "environment"; // 기본값: 후면 카메라
        let stream = null;

        // 시작하기 버튼 클릭 시 실행
        function startApp() {
            // 인트로 화면 서서히 사라지기
            introScreen.style.opacity = '0';
            
            setTimeout(() => {
                introScreen.style.display = 'none';
                appScreen.style.display = 'flex';
                document.body.classList.add('app-active'); // 밝은 배경으로 전환
                
                // 앱 화면 서서히 나타나기
                setTimeout(() => {
                    appScreen.style.opacity = '1';
                }, 50);

                // 카메라 켜기
                startCamera();
            }, 500);
        }

        // 카메라 시작 함수
        async function startCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            if (currentFacingMode === "user") {
                video.classList.add('mirror');
            } else {
                video.classList.remove('mirror');
            }

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: currentFacingMode,
                        width: { ideal: 1080 },
                        height: { ideal: 1440 }
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("카메라를 실행할 수 없거나 권한이 거부되었습니다.\n브라우저 설정에서 카메라 권한을 허용해주세요.");
                console.error(err);
            }
        }

        function toggleCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        }

        function takePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (currentFacingMode === "user") {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            // 테두리
            const padding = 30;
            ctx.lineWidth = 30;
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#e0b0ff');
            gradient.addColorStop(0.25, '#f0e68c');
            gradient.addColorStop(0.75, '#ffd700');
            gradient.addColorStop(1, '#ffb6c1');
            ctx.strokeStyle = gradient;
            ctx.strokeRect(padding, padding, canvas.width - (padding*2), canvas.height - (padding*2));

            ctx.shadowColor = "rgba(0,0,0,0.4)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // 꽃 장식
            ctx.font = '70px Arial';
            ctx.fillStyle = "rgba(224, 176, 255, 0.8)";
            ctx.textAlign = 'left';
            ctx.fillText('🌸🌿♥', padding + 15, padding + 70);
            ctx.textAlign = 'right';
            ctx.fillText('♥🌿🌺', canvas.width - padding - 15, padding + 70);
            ctx.textAlign = 'center';
            ctx.fillText('🌷', canvas.width / 2, padding + 60);
            
            ctx.textAlign = 'left';
            ctx.fillText('🌺🍃♥', padding + 15, canvas.height - padding - 20);
            ctx.textAlign = 'right';
            ctx.fillText('♥🍃🌸', canvas.width - padding - 15, canvas.height - padding - 20);
            
            ctx.font = '50px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('♥🌼💐🌼♥', canvas.width / 2, canvas.height - padding - 130);

            // 텍스트
            ctx.textAlign = 'center';
            
            ctx.font = 'bold 85px "Playfair Display", serif';
            ctx.fillStyle = '#d4af37';
            ctx.shadowColor = "rgba(253, 246, 227, 0.8)";
            ctx.fillText('혼인신고를 축하합니다', canvas.width / 2, padding + 180);

            ctx.font = '45px "Namsan", sans-serif';
            ctx.fillStyle = '#e0b0ff';
            ctx.fillText('오늘부터 우리는 하나 💍', canvas.width / 2, padding + 260);

            ctx.font = 'bold 55px "Namsan", sans-serif';
            ctx.fillStyle = '#fdf6e3';
            ctx.fillText('부천시 원미구', canvas.width / 2, canvas.height - padding - 60);

            // 다운로드
            const link = document.createElement('a');
            link.download = 'congratulations_photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
