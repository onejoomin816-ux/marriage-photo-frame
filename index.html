<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>혼인신고 축하 포토 프레임</title>
    <!-- 우아한 폰트 불러오기 -->
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Gowun Batang', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #camera-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 3/4;
            background: #000;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* 화려한 오버레이 프레임 디자인 */
        #frame-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-sizing: border-box;
            border: 15px solid transparent;
            border-image: linear-gradient(135deg, #f0e68c, #ffd700, #ffb6c1, #f0e68c) 1;
            pointer-events: none; /* 터치 방해 금지 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 15px;
            z-index: 10;
        }
        .header-text {
            text-align: center;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }
        .header-text h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #FFD700;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .header-text p {
            margin: 8px 0 0;
            font-size: 1.1rem;
            color: #FFF0F5;
        }
        .footer-text {
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 1.2rem;
            color: #ffffff;
            font-weight: 700;
        }
        #controls {
            margin-top: 25px;
            z-index: 20;
        }
        .capture-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-family: 'Gowun Batang', serif;
            font-weight: 700;
            color: #333;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 154, 158, 0.4);
            transition: transform 0.2s;
        }
        .capture-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="camera-wrapper">
        <video id="video" autoplay playsinline></video>
        
        <!-- 화면에 보여지는 프레임 장식 -->
        <div id="frame-overlay">
            <div class="header-text">
                <h1>혼인신고를 축하합니다</h1>
                <p>오늘부터 우리는 하나 💍</p>
            </div>
            <div class="footer-text">
                🌸 부천시 원미구 🌸
            </div>
        </div>
    </div>

    <div id="controls">
        <button class="capture-btn" onclick="takePhoto()">📸 사진 촬영 및 저장</button>
    </div>

    <script>
        const video = document.getElementById('video');

        // 후면 카메라 우선 요청
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment", // 후면 카메라 지정
                        width: { ideal: 1080 },
                        height: { ideal: 1440 }
                    },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                alert("카메라를 실행할 수 없습니다. 브라우저 권한 설정을 확인해주세요.");
                console.error(err);
            }
        }

        function takePhoto() {
            // 실제 이미지 크기에 맞게 캔버스 생성
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // 1. 카메라 영상 그리기
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 2. 화려한 테두리 그리기 (HTML의 디자인을 캔버스에도 동일하게 적용)
            const padding = 30;
            ctx.lineWidth = 30;
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#f0e68c');
            gradient.addColorStop(0.5, '#ffb6c1');
            gradient.addColorStop(1, '#ffd700');
            ctx.strokeStyle = gradient;
            ctx.strokeRect(padding, padding, canvas.width - (padding*2), canvas.height - (padding*2));

            // 3. 텍스트 설정 및 그리기
            ctx.textAlign = 'center';
            ctx.shadowColor = "rgba(0,0,0,0.7)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // 상단 메인 타이틀
            ctx.font = 'bold 80px "Gowun Batang", serif';
            ctx.fillStyle = '#FFD700';
            ctx.fillText('혼인신고를 축하합니다', canvas.width / 2, padding + 120);

            // 상단 서브 타이틀
            ctx.font = '45px "Gowun Batang", serif';
            ctx.fillStyle = '#FFF0F5';
            ctx.fillText('오늘부터 우리는 하나 💍', canvas.width / 2, padding + 200);

            // 하단 기관명
            ctx.font = 'bold 50px "Gowun Batang", serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('🌸 부천시 원미구 🌸', canvas.width / 2, canvas.height - padding - 60);

            // 4. 이미지 다운로드 처리
            const link = document.createElement('a');
            link.download = 'congratulations_photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 페이지 로드 시 카메라 자동 시작
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
